<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -60 1000 770" width="2000" height="1540" role="img" aria-label="Architecture secure-docker-stack">
  <style>
    text{font-family:"IBM Plex Sans","DejaVu Sans",Arial,sans-serif;fill:#17212b}
    .m{font-family:"IBM Plex Mono","DejaVu Sans Mono",Consolas,monospace}
    .mu{fill:#5b6b7a}
    .box{fill:#ffffff;stroke:#17212b;stroke-width:1.4}
    .hostbox{fill:#e9eef3;stroke:#c9d3dc;stroke-width:1.5;stroke-dasharray:6 4}
    .zf{fill:#e8f3f2;stroke:#0f8a83;stroke-width:1.5}
    .zb{fill:#f7efe4;stroke:#b86b0c;stroke-width:1.5}
    .lf{fill:#0f8a83} .lb{fill:#b86b0c}
    .flow{stroke:#17212b;stroke-width:1.8;fill:none}
    .flowf{stroke:#0f8a83;stroke-width:2;fill:none}
    .flowb{stroke:#b86b0c;stroke-width:2;fill:none}
    .dash{stroke:#5b6b7a;stroke-width:1.3;stroke-dasharray:4 4;fill:none}
    .secl{stroke:#b3263e;stroke-width:1.6;stroke-dasharray:5 4;fill:none}
    .hc{fill:#2f8a3e;font-size:11px}
    .vol{fill:#ffffff;stroke:#5a4fb3;stroke-width:1.4} .volt{fill:#5a4fb3;font-size:12px}
    .sec{fill:#ffffff;stroke:#b3263e;stroke-width:1.4} .sect{fill:#b3263e}
    .cfg{fill:#ffffff;stroke:#5b6b7a;stroke-width:1.2;stroke-dasharray:3 3}
    .hard{fill:#7a3f9e}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17212b"/></marker>
    <marker id="arf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f8a83"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86b0c"/></marker>
    <marker id="ars" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3263e"/></marker>
  </defs>

  <rect x="0" y="-60" width="1000" height="770" fill="#f5f7f9"/>

  <!-- Titre -->
  <text x="18" y="-26" font-size="22" font-weight="600" class="m">secure-docker-stack</text>
  <text x="18" y="-6" font-size="13" class="mu">Architecture · Docker Compose · Nginx · Flask/Gunicorn · PostgreSQL · Redis · Trivy</text>

  <!-- Hôte -->
  <rect class="hostbox" x="190" y="16" width="796" height="608" rx="10"/>
  <text x="208" y="40" font-size="13" font-weight="600">Hôte Debian 13 · Docker Engine</text>
  <text x="208" y="57" font-size="12" class="m mu">projet Compose : secure-docker-stack</text>

  <!-- Réseaux -->
  <rect class="zb" x="470" y="70" width="496" height="516" rx="8"/>
  <text x="948" y="94" font-size="13" font-weight="600" text-anchor="end" class="m lb">backend-net</text>
  <text x="948" y="110" font-size="11" text-anchor="end" class="lb">internal: true · pas d'accès Internet</text>
  <rect class="zf" x="222" y="232" width="464" height="180" rx="8"/>
  <text x="238" y="254" font-size="13" font-weight="600" class="m lf">frontend-net</text>

  <!-- Navigateur -->
  <rect class="box" x="18" y="282" width="140" height="76" rx="6"/>
  <text x="88" y="314" font-size="14" font-weight="600" text-anchor="middle">Navigateur</text>
  <text x="88" y="334" font-size="11" text-anchor="middle" class="m mu">localhost:8080</text>

  <!-- Port publié -->
  <line class="flow" x1="158" y1="320" x2="250" y2="320" marker-end="url(#ar)"/>
  <rect fill="#17212b" x="168" y="300" width="44" height="20" rx="3"/>
  <text x="190" y="314" font-size="11" font-weight="600" text-anchor="middle" class="m" fill="#f5f7f9" style="fill:#f5f7f9">8080</text>
  <text x="88" y="380" font-size="10.5" text-anchor="middle" class="mu">8080 : seul port exposé</text>

  <!-- Nginx -->
  <rect class="box" x="252" y="276" width="160" height="96" rx="6"/>
  <text x="270" y="302" font-size="15" font-weight="600">nginx</text>
  <text x="270" y="320" font-size="11" class="mu">reverse proxy · 1.27-alpine</text>
  <text x="270" y="338" font-size="11" class="m mu">:80 ← hôte 8080</text>
  <text x="270" y="360" class="m hc">♥ /nginx-health</text>

  <!-- nginx -> app -->
  <line class="flowf" x1="412" y1="324" x2="494" y2="324" marker-end="url(#arf)"/>
  <text x="453" y="314" font-size="11" text-anchor="middle" class="m lf">proxy_pass</text>
  <text x="453" y="342" font-size="11" text-anchor="middle" class="m lf">app:5000</text>

  <!-- App -->
  <rect class="box" x="496" y="246" width="176" height="156" rx="6"/>
  <text x="512" y="270" font-size="15" font-weight="600">app</text>
  <text x="512" y="288" font-size="11" class="mu">Flask + Gunicorn</text>
  <text x="512" y="306" font-size="11" class="m mu">:5000 (interne)</text>
  <text x="512" y="324" font-size="11" class="m mu">/  /health  /clients</text>
  <text x="512" y="342" font-size="11" class="m mu">user non-root (10001)</text>
  <text x="512" y="358" font-size="10.5" class="m hard">read_only · cap_drop ALL</text>
  <text x="512" y="373" font-size="10.5" class="m hard">no-new-privileges</text>
  <text x="512" y="392" class="m hc">♥ /health</text>
  <rect class="cfg" x="496" y="414" width="176" height="40" rx="4"/>
  <text x="584" y="430" font-size="11" text-anchor="middle" class="m">image monapp:1.1</text>
  <text x="584" y="445" font-size="10" text-anchor="middle" class="mu">multi-stage · trixie · sans pip</text>

  <!-- .env -->
  <rect class="cfg" x="513" y="128" width="142" height="48" rx="4"/>
  <text x="584" y="148" font-size="12" text-anchor="middle" class="m">.env</text>
  <text x="584" y="165" font-size="10" text-anchor="middle" class="mu">env_file · hors de Git</text>
  <line class="dash" x1="584" y1="176" x2="584" y2="244"/>
  <line class="dash" x1="655" y1="152" x2="756" y2="152"/>

  <!-- PostgreSQL -->
  <rect class="box" x="758" y="128" width="182" height="108" rx="6"/>
  <text x="776" y="154" font-size="15" font-weight="600">db</text>
  <text x="776" y="172" font-size="11" class="mu">PostgreSQL 16</text>
  <text x="776" y="190" font-size="11" class="m mu">:5432 (interne)</text>
  <text x="776" y="208" font-size="11" class="m mu">init.sql → table clients</text>
  <text x="776" y="226" class="m hc">♥ pg_isready</text>
  <path class="flowb" d="M672 296 C 714 296, 714 200, 756 200" marker-end="url(#arb)"/>
  <text x="742" y="292" font-size="11" text-anchor="middle" class="m lb">SQL</text>
  <text x="742" y="306" font-size="11" text-anchor="middle" class="m lb">db:5432</text>
  <line class="dash" x1="848" y1="236" x2="848" y2="252"/>
  <rect class="vol" x="796" y="252" width="104" height="26" rx="13"/>
  <text x="848" y="270" text-anchor="middle" class="m volt">vol. pgdata</text>

  <!-- Redis -->
  <rect class="box" x="758" y="404" width="182" height="96" rx="6"/>
  <text x="776" y="430" font-size="15" font-weight="600">redis</text>
  <text x="776" y="448" font-size="11" class="mu">Redis 7.4 · cache TTL 30 s</text>
  <text x="776" y="466" font-size="11" class="m mu">:6379 (interne) · AOF</text>
  <text x="776" y="488" class="m hc">♥ redis-cli ping</text>
  <path class="flowb" d="M672 352 C 714 352, 714 452, 756 452" marker-end="url(#arb)"/>
  <text x="742" y="368" font-size="11" text-anchor="middle" class="m lb">cache</text>
  <text x="742" y="382" font-size="11" text-anchor="middle" class="m lb">redis:6379</text>
  <line class="dash" x1="848" y1="500" x2="848" y2="516"/>
  <rect class="vol" x="790" y="516" width="116" height="26" rx="13"/>
  <text x="848" y="534" text-anchor="middle" class="m volt">vol. redisdata</text>

  <!-- Robustesse -->
  <rect class="cfg" x="500" y="476" width="226" height="74" rx="4"/>
  <text x="514" y="496" font-size="12" font-weight="600">Robustesse (Compose)</text>
  <text x="514" y="514" font-size="11" class="m mu">restart: unless-stopped</text>
  <text x="514" y="530" font-size="11" class="m mu">depends_on: service_healthy</text>
  <text x="514" y="546" font-size="11" class="m mu">♥ healthcheck ×4</text>

  <!-- Trivy -->
  <rect class="sec" x="222" y="470" width="214" height="104" rx="6"/>
  <text x="238" y="496" font-size="15" font-weight="600" class="sect">trivy</text>
  <text x="238" y="514" font-size="11" class="mu">profil security · à la demande</text>
  <text x="238" y="532" font-size="11" class="m mu">--severity HIGH,CRITICAL</text>
  <text x="238" y="550" font-size="11" class="m mu">68 → 44 CVE · 0 CRITICAL</text>
  <text x="238" y="566" font-size="10" class="m mu">docs/trivy/*.txt</text>
  <path class="secl" d="M436 510 C 470 510, 470 434, 494 434" marker-end="url(#ars)"/>

  <text x="208" y="608" font-size="11" class="mu">Les ports 5000, 5432 et 6379 ne sont jamais publiés sur l'hôte : les services se joignent par leur nom (DNS interne Docker).</text>

  <!-- Légende -->
  <g font-size="12">
    <line x1="18" y1="664" x2="44" y2="664" stroke="#17212b" stroke-width="2"/>
    <text x="52" y="668" class="mu">HTTP depuis l'hôte</text>
    <line x1="182" y1="664" x2="208" y2="664" stroke="#0f8a83" stroke-width="2"/>
    <text x="216" y="668" class="mu">frontend-net (nginx ↔ app)</text>
    <line x1="400" y1="664" x2="426" y2="664" stroke="#b86b0c" stroke-width="2"/>
    <text x="434" y="668" class="mu">backend-net (app ↔ db, redis)</text>
    <line x1="636" y1="664" x2="662" y2="664" stroke="#b3263e" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="670" y="668" class="mu">scan Trivy</text>
    <rect x="760" y="656" width="30" height="16" rx="8" fill="#ffffff" stroke="#5a4fb3" stroke-width="1.4"/>
    <text x="798" y="668" class="mu">volume nommé</text>
    <text x="18" y="694" class="m hc">♥ healthcheck</text>
    <text x="130" y="694" class="m hard" font-size="12">durcissement du conteneur</text>
  </g>
</svg>
