name: secure-docker-stack

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"                # SEUL port publié sur l'hôte
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend-net
    depends_on:
      - app


  app:
    build: ./app                 # construit depuis app/Dockerfile
    image: monapp:1.0            # et nomme l'image avec un tag fixe
    env_file: .env               # POSTGRES_DB / USER / PASSWORD
    environment:
      DB_HOST: db                # nom du service = nom DNS
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    networks:
      - frontend-net
      - backend-net
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    env_file: .env               # l'image postgres crée la base et l'utilisateur
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    # Aucun "ports:" : PostgreSQL n'est pas joignable depuis l'hôte
    networks:
      - backend-net

  redis:
    image: redis:7.4-alpine      # version figée, image légère
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    # 