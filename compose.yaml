name: secure-docker-stack

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"                # SEUL port publié sur l'hôte
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend-net
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  app:
    build: ./app                 # construit depuis app/Dockerfile
    image: monapp:1.1            # et nomme l'image avec un tag fixe
    env_file: .env               # POSTGRES_DB / USER / PASSWORD
    environment:
      DB_HOST: db                # nom du service = nom DNS
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    networks:
      - frontend-net
      - backend-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

    # Sécurité renforcée : l'application ne peut pas écrire sur le système de fichiers du conteneur
    read_only: true                    # système de fichiers en lecture seule
    tmpfs:
      - /tmp                           # seul espace inscriptible (en RAM), utilisé par gunicorn
    security_opt:
      - no-new-privileges:true         # les binaires setuid (mount…) ne donnent plus root
    cap_drop:
      - ALL                            # aucune capability Linux

  db:
    image: postgres:16
    env_file: .env               # l'image postgres crée la base et l'utilisateur
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    # Aucun "ports:" : PostgreSQL n'est pas joignable depuis l'hôte
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine      # version figée, image légère
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    # Aucun "ports:" : Redis reste interne
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # Trivy : scanner de vulnérabilités
  trivy:
    image: aquasec/trivy:0.76.0        # mets la version exacte de "trivy --version"
    profiles: ["security"]             # ne démarre PAS avec "docker compose up"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - trivy-cache:/root/.cache/trivy
      - ./docs/trivy:/reports
    command: >
      image --severity HIGH,CRITICAL --format table
      --output /reports/compose-scan-monapp-1.1.txt monapp:1.1

volumes:
  pgdata:                        # volume nommé, géré par Docker
  redisdata:
  trivy-cache:

networks:
  frontend-net:
  backend-net:
    internal: true               # pas de sortie vers Internet
