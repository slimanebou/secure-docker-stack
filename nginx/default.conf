server {
    listen 80;
    server_name _;
    server_tokens off;                  # masque la version de Nginx

    # En-têtes de sécurité HTTP
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Santé de Nginx lui-même, sans passer par Flask (vérifier que Nginx fonctionne indépendamment de Flask.)
    #vérifie que Nginx lui-même répond.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    #passe par Nginx puis Flask, donc vérifie aussi que Flask répond.
    location / {
        proxy_pass http://app:5000;     # nom du service Compose + port interne

        # Transmet à Flask les infos du vrai client
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        #Fixer des délais d'attente
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}